        .review-box {
            font-family: "Nunito", sans-serif;
            background-color: #f9d4e672;
            margin-top: 25px;
            margin-left: 35%;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            font-size: 23px;
        }

        .review-box img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #a5d6a7;
        }

        .email {
            color: #666;
            font-size: 0.9em;
            margin-top: 8px;
        }

        .comment {
            margin: 20px 0;
            font-style: italic;
            color: #333;
        }

        .arrows {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .arrow {
            cursor: pointer;
            background-color: #a55a7f72;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 50%;
            font-size: 20px;
            transition: background-color 0.3s;
        }

        .arrow:hover {
            background-color: #ae4d7d;
        }
